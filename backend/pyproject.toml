[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homepilot"
version = "0.1.0"
description = "Motor de simulação e API para planejamento de financiamentos imobiliários brasileiros"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/homepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
