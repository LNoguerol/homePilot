services:
  banco:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: homepilot
      MARIADB_USER: homepilot
      MARIADB_PASSWORD: ${HOMEPILOT_DB_SENHA}
      MARIADB_ROOT_PASSWORD: ${HOMEPILOT_DB_SENHA_ROOT}
    volumes:
      - banco_dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${HOMEPILOT_DB_SENHA_ROOT}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - HOMEPILOT_DB_HOST=banco
      - HOMEPILOT_DB_PORT=3306
      - HOMEPILOT_DB_NOME=homepilot
      - HOMEPILOT_DB_USUARIO=homepilot
      - HOMEPILOT_DB_SENHA=${HOMEPILOT_DB_SENHA}
      - HOMEPILOT_JWT_SECRET=${HOMEPILOT_JWT_SECRET}
    depends_on:
      banco:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  banco_dados:
